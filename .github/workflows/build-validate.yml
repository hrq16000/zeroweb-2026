name: build-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Instalação determinística a partir do lockfile (equivalente ao `npm ci`).
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build (development)
        run: node scripts/build-with-recovery.mjs --mode development

      - name: Build (production)
        run: node scripts/build-with-recovery.mjs

      # Gate canônico de PR: valida o HTML realmente gerado pelo head da PR.
      # Reaproveita o artefato
      # de produção construído acima e sobe UM preview local para os três gates.
      # Nenhum destes checks consulta a produção durante pull_request.
      - name: SEO preview da PR — JSON-LD, sitemap/robots e diff
        env:
          SEO_JSONLD_BASELINE_FILE: seo-reports/seo-preview-baseline.json
        run: >-
          node scripts/ci-with-prod-preview.mjs --
          bash -lc
          'node scripts/validate-jsonld.mjs &&
           node scripts/validate-sitemaps.mjs &&
           node scripts/run-seo-diff.mjs'

      # Regressão de privacidade: falha o CI se um chunk público voltar a
      # embutir wa.me / telefone / e-mail não-allowlisted.
      - name: Client privacy regression
        run: |
          bun run validate:client-privacy
          bun run validate:dist-contact

      - name: Portfolio SEO metadata (canonical, Schema.org and Open Graph)
        run: bun run validate:portfolio-meta

      - name: Portfolio client isolation and shared mechanisms
        run: bun run validate:portfolio-boundaries

      - name: Generate DYZ changelog and validation summary
        run: bun run changelog:dyz

      - name: Upload privacy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-privacy-report
          path: seo-reports/client-privacy-report.json
          if-no-files-found: ignore

      - name: Upload DYZ changelog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyzpromo-changelog
          path: seo-reports/dyzpromo-changelog.md
          if-no-files-found: ignore

  vercel-runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runtime build changes
        id: impact
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "$BASE" "$HEAD")"
          if printf '%s\n' "$files" | grep -Eq '^(vite\.config\.ts|package\.json|bun\.lockb?|vercel\.json|scripts/prepare-vercel-mcp-runtime\.mjs|tests/mcp/vercel-runtime\.test\.mjs|src/lib/mcp/|src/routes/mcp\.ts|src/routes/\[\.well-known\]/oauth-protected-resource\.ts|\.github/workflows/build-validate\.yml)$|^src/lib/mcp/'; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.impact.outputs.affected == 'true'
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        if: steps.impact.outputs.affected == 'true'
        with:
          bun-version: '1.4.0'
      - name: Install frozen dependencies
        if: steps.impact.outputs.affected == 'true'
        run: bun install --frozen-lockfile
      - name: Vercel production build
        if: steps.impact.outputs.affected == 'true'
        env:
          VERCEL: '1'
          NITRO_PRESET: vercel
        run: bun run build
      - name: Verify Vercel output and real MCP SDK on Node
        if: steps.impact.outputs.affected == 'true'
        run: |
          test -f .vercel/output/config.json
          node --test tests/mcp/vercel-runtime.test.mjs
