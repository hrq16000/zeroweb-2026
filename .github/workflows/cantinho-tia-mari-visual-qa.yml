name: Cantinho Tia Mari · visual QA
on:
  pull_request:
    paths:
      - 'src/components/site/CantinhoTiaMariPage.tsx'
      - 'src/routes/portfolio.cantinho-da-tia-mari.tsx'
      - 'src/config/portfolio-project-manifests.json'
      - 'scripts/verify-cantinho-tia-mari.mjs'
      - '.github/workflows/cantinho-tia-mari-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cantinho-visual:
    name: Cantinho da Tia Mari · mobile/desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build app
        run: VERCEL_ENV=preview bunx vite build --mode development
      - name: Inspect route, SEO, photos and CTA
        run: VERCEL_ENV=preview node scripts/ci-with-prod-preview.mjs -- node scripts/verify-cantinho-tia-mari.mjs
      - name: Screenshots (real)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cantinho-tia-mari-visual-390-1440
          path: seo-reports/cantinho-tia-mari-visual/*.png
          if-no-files-found: warn
          retention-days: 30
