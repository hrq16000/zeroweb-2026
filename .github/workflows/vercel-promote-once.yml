name: Promote validated Vercel preview once

on:
  push:
    branches:
      - ops/promote-main-f7a7ba5-20260923

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repository secret is not configured."
            exit 78
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Promote validated deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel promote zeroweb-2026-aljd31w8l-msolus.vercel.app \
            --yes \
            --scope msolus \
            --token "$VERCEL_TOKEN"
