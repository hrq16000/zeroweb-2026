name: BPL Locações · Chromium visual QA
on:
  pull_request:
    paths:
      - 'src/components/site/BplLocacoesBrinquedosPage.tsx'
      - 'src/routes/portfolio.bpl-locacoes-de-brinquedos.tsx'
      - 'src/config/portfolio-project-manifests.json'
      - 'scripts/verify-bpl-portfolio.mjs'
      - '.github/workflows/bpl-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bpl-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bpl-visual:
    name: BPL · 390/768/1440 + NO-BRAND evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build QA without deploying
        run: VERCEL_ENV=preview bunx vite build --mode development
      - name: BPL screenshots and isolated funnel
        run: VERCEL_ENV=preview node scripts/ci-with-prod-preview.mjs -- node scripts/verify-bpl-portfolio.mjs
      - name: Upload real screenshots for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpl-visual-390-768-1440-nobrand
          path: seo-reports/bpl-visual/*.png
          if-no-files-found: warn
          retention-days: 30
