name: Doce Coracao - QA 390/768/1440 e NO-BRAND
on:
  pull_request:
    paths:
      - 'src/components/site/PanificadoraDoceCoracaoSantoAntonioPage.tsx'
      - 'src/components/site/panificadora-doce-coracao.css'
      - 'src/routes/portfolio.panificadora-doce-coracao-santo-antonio.tsx'
      - 'src/config/portfolio-project-manifests.json'
      - 'scripts/verify-doce-coracao.mjs'
      - '.github/workflows/doce-coracao-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual-qa:
    name: Doce Coracao - Chromium 390/768/1440
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Dependencias
        run: bun install --frozen-lockfile
      - name: Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build isolado do preview
        run: VERCEL_ENV=preview bunx vite build --mode development
      - name: QA real, modais e capturas NO-BRAND
        run: VERCEL_ENV=preview node scripts/ci-with-prod-preview.mjs -- node scripts/verify-doce-coracao.mjs
      - name: Capturar e versionar somente as tres referencias VISUAIS NOVAS da Doce Coracao
        if: github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$TARGET_BRANCH" != "feat/portfolio-doce-coracao-santo-antonio-20261119" ]; then
            echo "Branch inesperada; snapshots nao serao criados."
            exit 1
          fi
          slug="panificadora-doce-coracao-santo-antonio"
          for viewport in desktop tablet mobile; do
            path="tests/visual/baseline/$slug-$viewport.png"
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              echo "Baseline ja versionada: $path; nao substituir referencia existente."
              exit 1
            fi
          done
          VISUAL_ONLY="$slug" VISUAL_CONCURRENCY=1 VERCEL_ENV=preview \
            node scripts/ci-with-prod-preview.mjs -- node scripts/playwright-visual-regression.mjs
          for viewport in desktop tablet mobile; do
            path="tests/visual/baseline/$slug-$viewport.png"
            test -s "$path"
            git add -- "$path"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 1
          git commit -m "test(doce-coracao): adicionar somente 3 novas baselines Chromium revisadas"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doce-coracao-real-qa-390-768-1440-nobrand
          path: |
            seo-reports/doce-coracao-visual/*
            tests/visual/baseline/panificadora-doce-coracao-santo-antonio-*.png
          if-no-files-found: warn
          retention-days: 30
