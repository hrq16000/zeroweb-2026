name: Portfolio sitemap · GSC + IndexNow

on:
  push:
    branches: [main]
    paths:
      - "src/config/portfolio-catalog.json"
      - "src/lib/portfolio-site-registry.ts"
      - "src/lib/portfolio-sitemap.server.ts"
      - "src/routes/sitemap-portfolio*.ts"
      - ".github/workflows/portfolio-sitemap-sync.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Atualizar sitemap dinâmico e enviar sinais de indexação
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_URL: https://0web.com.br/api/public/hooks/portfolio-sitemap-sync
          SITEMAP_URL: https://0web.com.br/sitemap-portfolio.xml
        run: |
          set -euo pipefail

          # O sitemap público é a base de descoberta e deve estar saudável
          # independentemente da integração autenticada de GSC/IndexNow.
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$SITEMAP_URL" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Sitemap não respondeu após a publicação" >&2
              exit 1
            fi
            sleep 15
          done

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=Sincronização de indexação não executada::CRON_SECRET não está configurado. O sitemap respondeu, mas esta execução NÃO enviou sinais via hook GSC/IndexNow. Configure o secret ou remova o agendamento autenticado."
            exit 1
          fi

          curl --fail --silent --show-error \
            -X POST "$SYNC_URL" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "content-type: application/json" \
            --data '{"slugs":[]}'
