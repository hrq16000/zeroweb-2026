name: Portfolio sitemap · healthcheck

# Os sinais de indexação são enviados no momento da publicação/despublicação
# pelo próprio backend (syncPortfolioSitemapAndIndexing). Este workflow valida
# apenas a camada pública de descoberta e não depende de segredo duplicado.
on:
  push:
    branches: [main]
    paths:
      - "src/config/portfolio-catalog.json"
      - "src/lib/portfolio-site-registry.ts"
      - "src/lib/portfolio-sitemap.server.ts"
      - "src/routes/sitemap-portfolio*.ts"
      - ".github/workflows/portfolio-sitemap-sync.yml"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  sitemap-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar sitemap público de portfólios
        env:
          SITEMAP_URL: https://0web.com.br/sitemap-portfolio.xml
        run: |
          set -euo pipefail

          TMP_FILE="$(mktemp)"
          trap 'rm -f "$TMP_FILE"' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$SITEMAP_URL" -o "$TMP_FILE"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error title=Sitemap indisponível::sitemap-portfolio.xml não respondeu após 20 tentativas."
              exit 1
            fi
            sleep 15
          done

          if ! grep -q '<urlset' "$TMP_FILE"; then
            echo "::error title=Sitemap inválido::Resposta não contém <urlset>."
            exit 1
          fi

          if ! grep -q '<loc>https://0web.com.br/portfolio' "$TMP_FILE"; then
            echo "::error title=Descoberta de portfólio ausente::Nenhuma URL canônica de /portfolio foi encontrada."
            exit 1
          fi

          COUNT="$(grep -o '<loc>[^<]*</loc>' "$TMP_FILE" | wc -l | tr -d ' ')"
          echo "Sitemap saudável: $COUNT URLs publicadas."
          echo "GSC/IndexNow são sincronizados transacionalmente pelo backend quando o estado de publicação muda."
