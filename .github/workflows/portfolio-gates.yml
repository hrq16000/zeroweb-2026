name: portfolio-gates

# Portões obrigatórios do playbook (docs/PORTFOLIO_NEW_CLIENT_PLAYBOOK.md).
# Todo PR que toca /portfolio, o design system ou os validadores passa por aqui
# antes de qualquer publicação.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: Testes, tipos e validadores estáticos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Privacidade em nível de fonte
        run: bun run scan:source-privacy

      - name: Integridade da raiz institucional 0WEB
        run: bun run validate:brand-integrity

      - name: validate:portfolio-boundaries
        run: bun run validate:portfolio-boundaries

      - name: validate:portfolio-catalog
        run: bun run validate:portfolio-catalog

      - name: validate:portfolio-meta
        run: bun run validate:portfolio-meta

      - name: validate:portfolio-scaffold
        run: bun run validate:portfolio-scaffold

      - name: Unicidade autoral declarada
        run: bun run check:portfolio-uniqueness

      - name: Regressão de originalidade no código renderizado
        run: bun run check:portfolio-originality:enforce

  runtime-gates:
    name: Pop-up, funis, acessibilidade e regressão visual
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: static-gates
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Sitemaps XML sem service-role key (HTTP real)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: node scripts/ci-with-prod-preview.mjs -- node scripts/check-sitemap-runtime-no-keys.mjs

      - name: Sitemaps editoriais com host canonico (HTTP real)
        run: node scripts/ci-with-prod-preview.mjs -- node scripts/check-sitemap-canonical-host.mjs

      - name: Snapshot de indexabilidade (produção = "antes")
        continue-on-error: true
        run: bun run audit:indexability -- --label=before https://0web.com.br

      - name: Detectar escopo E2E do PR
        id: e2e-scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ONLY=""
          SERVICE_IMAGES_ONLY=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" "$PR_HEAD_SHA" >/dev/null 2>&1 || true
            FILES="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" || true)"
            ONLY="$(printf '%s\n' "$FILES" | node scripts/resolve-visual-regression-scope.mjs)"
            if [ "$(node scripts/resolve-framework-compat-scope.mjs "$PR_BASE_SHA" "$PR_HEAD_SHA" || true)" = "framework" ]; then
              ONLY="rm-fretes,aguia-sul-sinalizacao,btb-construcao,clinica-integrada,dlara-pizzaria,premium-envelopamentos"
            fi

            # Isolado a imagens da loja: 6 canarios de portfolio x 2 viewports.
            # Mudancas em portfolios, funis, CTAs ou push no main seguem globais.
            if [ -n "$FILES" ]; then
              SERVICE_IMAGES_ONLY=true
              while IFS= read -r FILE; do
                case "$FILE" in
                  src/components/site/ServiceCoverImage.tsx|src/components/site/FeaturedServices.tsx|src/components/site/ProductGallery.tsx|src/components/site/RelatedServicesCarousel.tsx|src/routes/servicos.index.tsx|'src/routes/servicos.$slug.tsx'|src/routes/servicos.google-meu-negocio.tsx|src/routes/servicos.presenca-digital.tsx|src/routes/servicos.trafego-pago-local.tsx|tests/services/special-service-images.test.ts|src/lib/services-public.functions.ts|tests/services/storefront-cover-contract.test.ts|tests/services/service-gallery-image-recovery.test.ts|src/lib/services-nav.functions.ts|src/lib/service-legacy-image-recovery.ts|src/config/service-legacy-image-recovery.json|scripts/validate-catalog-images.mjs|tests/services/service-legacy-image-recovery.test.ts|src/lib/service-gallery-recovery.ts|tests/services/google-ads-gallery-recovery.test.ts|.github/workflows/lighthouse.yml|.lighthouserc.cjs|.github/workflows/portfolio-gates.yml) ;;
                  *) SERVICE_IMAGES_ONLY=false ;;
                esac
              done < <(printf '%s\n' "$FILES")
            fi
            if [ "$SERVICE_IMAGES_ONLY" = true ]; then
              ONLY="rm-fretes,aguia-sul-sinalizacao,btb-construcao,clinica-integrada,dlara-pizzaria,premium-envelopamentos"
            fi

            # Verificação do painel autenticado: seis canários sem alteração
            # de limiares; o push em main permanece 100% global.
            ADMIN_IMAGES_ONLY=true
            if [ -z "$FILES" ]; then ADMIN_IMAGES_ONLY=false; fi
            while IFS= read -r FILE; do
              case "$FILE" in
                src/routes/_authenticated/app.servicos-imagens.tsx|src/lib/service-image-preview-state.ts|tests/services/service-image-preview-state.test.ts|.github/workflows/lighthouse.yml|.github/workflows/portfolio-gates.yml) ;;
                *) ADMIN_IMAGES_ONLY=false ;;
              esac
            done < <(printf '%s\n' "$FILES")
            if [ "$ADMIN_IMAGES_ONLY" = true ]; then
              ONLY="rm-fretes,aguia-sul-sinalizacao,btb-construcao,clinica-integrada,dlara-pizzaria,premium-envelopamentos"
            fi

            # Somente verificadores offline do inventário de imagens, sem
            # alteração de componentes, assets nem HTML: exercita canários
            # reais mantendo os mesmos gates, sem simular impacto global.
            IMAGE_VALIDATORS_ONLY=true
            if [ -z "$FILES" ]; then IMAGE_VALIDATORS_ONLY=false; fi
            while IFS= read -r FILE; do
              case "$FILE" in
                scripts/validate-portfolio-assets.mjs|scripts/validate-service-fallback-assets.mjs|tests/services/service-fallback-assets.test.ts|package.json|.github/workflows/portfolio-gates.yml) ;;
                *) IMAGE_VALIDATORS_ONLY=false ;;
              esac
            done < <(printf '%s\n' "$FILES")
            if [ "$IMAGE_VALIDATORS_ONLY" = true ]; then
              ONLY="rm-fretes,aguia-sul-sinalizacao,btb-construcao,clinica-integrada,dlara-pizzaria,premium-envelopamentos"
            fi
          fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "services_only=$SERVICE_IMAGES_ONLY" >> "$GITHUB_OUTPUT"
          echo "admin_images_only=$ADMIN_IMAGES_ONLY" >> "$GITHUB_OUTPUT"
          echo "escopo E2E: ${ONLY:-global}"
          echo "exclusivo imagens-servicos=$SERVICE_IMAGES_ONLY"

      - name: Pop-up único em /portfolio/$slug
        env:
          POPUP_CONCURRENCY: 4
          POPUP_SLUGS: ${{ steps.e2e-scope.outputs.only }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci-with-prod-preview.mjs -- bun run test:e2e:portfolio-popup

      - name: Funis individuais de portfólio
        env:
          E2E_ONLY_SLUGS: ${{ steps.e2e-scope.outputs.only }}
          # Dois contextos independentes: preserva todos os slugs x viewports,
          # mas reduz o gargalo serial de 192 cenarios na verificacao global.
          E2E_CONCURRENCY: 2
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            node scripts/ci-with-prod-preview.mjs -- bun run test:e2e:portfolio-funnels
          else
            echo "SUPABASE_SERVICE_ROLE_KEY não está configurada no GitHub; executando o gate E2E sem escrita externa."
            E2E_DRY_RUN=1 node scripts/ci-with-prod-preview.mjs -- bun run test:e2e:portfolio-funnels
          fi

      - name: Prévias de link e ícones (headless)
        run: node scripts/ci-with-prod-preview.mjs -- bun run validate:link-previews

      - name: Ícones do <head> (status, content-type, dimensões)
        run: node scripts/ci-with-prod-preview.mjs -- bun run validate:head-icons

      - name: Indexabilidade do build ("depois") e diff
        env:
          INDEXABILITY_STRICT: "1"
        run: node scripts/ci-with-prod-preview.mjs -- bun run audit:indexability -- --label=after

      - name: Acessibilidade (axe-core)
        run: node scripts/ci-with-prod-preview.mjs -- bun run audit:a11y

      - name: Detectar impacto visual da mudança
        id: visual-scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
            HEAD="$PUSH_HEAD_SHA"
          fi

          git fetch --no-tags --depth=1 origin "$BASE" "$HEAD" >/dev/null 2>&1 || true
          FILES="$(git diff --name-only "$BASE" "$HEAD" || true)"
          RUN=false
          FRAMEWORK_COMPAT=false

          if [ "$(node scripts/resolve-framework-compat-scope.mjs "$BASE" "$HEAD" || true)" = "framework" ]; then
            RUN=true
            FRAMEWORK_COMPAT=true
          fi

          # Troca isolada de OG social + cache-bust não altera o DOM visível.
          # Esses casos continuam cobertos pelos gates de link preview/head e
          # não devem disparar regressão visual/Lighthouse de todos os projetos.
          SOCIAL_PREVIEW_ONLY=true
          if [ -z "$FILES" ]; then
            SOCIAL_PREVIEW_ONLY=false
          fi
          while IFS= read -r FILE; do
            case "$FILE" in
              public/images/*/social-og.jpg|src/config/portfolio-assets.json|src/config/portfolio-admin-seed.json) ;;
              *) SOCIAL_PREVIEW_ONLY=false ;;
            esac
          done < <(printf '%s\n' "$FILES")

          if [ "$SOCIAL_PREVIEW_ONLY" = true ]; then
            CONFIG_DIFF="$(git diff --unified=0 "$BASE" "$HEAD" -- src/config/portfolio-assets.json src/config/portfolio-admin-seed.json \
              | grep -E '^[+-]' \
              | grep -Ev '^(---|\+\+\+)' \
              | grep -Ev '^[+-][[:space:]]*"socialVersion":' || true)"
            if [ -n "$CONFIG_DIFF" ]; then
              SOCIAL_PREVIEW_ONLY=false
            fi
          fi

          # Mudanças de componentes, estilos, assets ou rotas visuais exigem o
          # gate completo. O registry de WhatsApp e código server-only não.
          if [ "$SOCIAL_PREVIEW_ONLY" != true ] && printf '%s\n' "$FILES" | grep -Eq '^(src/(components|pages|styles|assets)/|public/|src/.*\.(css|scss)$|tailwind|vite\.config|bun\.lock)'; then
            RUN=true
          fi

          # Rotas normalmente afetam UI. A rota dinâmica de portfolio é tratada
          # à parte porque esta PR altera somente metadata do <head>.
          if printf '%s\n' "$FILES" | grep -E '^src/routes/' | grep -Fvx 'src/routes/portfolio.$slug.tsx' >/dev/null; then
            RUN=true
          fi

          if printf '%s\n' "$FILES" | grep -Fx 'src/routes/portfolio.$slug.tsx' >/dev/null; then
            ROUTE_DIFF="$(git diff --unified=0 "$BASE" "$HEAD" -- 'src/routes/portfolio.$slug.tsx'               | grep -E '^[+-]'               | grep -Ev '^(---|\+\+\+)'               | grep -Eiv 'apple-touch-icon|sizes:|rel: "icon"|canonical|meta:|title:|description:|og:|twitter:|@type.*WebPage|@id.*url|^[+-][[:space:]]*url,?$|name: (project\.seoTitle|title),?$|description: (project\.seoDescription|description),?$|^[+-][[:space:]]*description,?$|inLanguage: "pt-BR"|isPartOf:|^[+-][[:space:]]*[{}],?$' || true)"
            if [ -n "$ROUTE_DIFF" ]; then
              RUN=true
            fi
          fi

          # Alteração comprovadamente exclusiva de XML não modifica a UI.
          # A função verifica o diff inteiro; escopo incerto mantém gate global.
          if [ "$(node scripts/classify-sitemap-only-diff.mjs "$BASE" "$HEAD" || true)" = "sitemap-only" ]; then
            RUN=false
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"

          # Quando a mudança visual está restrita a componentes/ativos de
          # portfolios individuais registrados, limita a comparação a esses
          # slugs. Qualquer arquivo visual compartilhado mantém escopo global.
          VISUAL_ONLY="$(printf '%s\n' "$FILES" | node scripts/resolve-visual-regression-scope.mjs)"
          if [ "$FRAMEWORK_COMPAT" = true ]; then
            # O upgrade de framework é validado em páginas visualmente estáveis.
            # O limiar continua 2%; mudanças visuais reais continuam usando o
            # escopo normal por slug ou o global.
            VISUAL_ONLY="rm-fretes,aguia-sul-sinalizacao,btb-construcao,clinica-integrada,dlara-pizzaria,premium-envelopamentos"
          fi
          if [ "${{ steps.e2e-scope.outputs.services_only }}" = "true" ] || [ "${{ steps.e2e-scope.outputs.admin_images_only }}" = "true" ]; then
            VISUAL_ONLY="rm-fretes,aguia-sul-sinalizacao,btb-construcao,clinica-integrada,dlara-pizzaria,premium-envelopamentos"
          fi
          # Main sempre verifica o universo completo; escopo por slug só no PR.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            VISUAL_ONLY=""
          fi
          echo "only=$VISUAL_ONLY" >> "$GITHUB_OUTPUT"
          echo "impacto visual: $RUN · escopo: ${VISUAL_ONLY:-global}"

      - name: Regressão visual (home + portfólios, 3 viewports)
        if: steps.visual-scope.outputs.run == 'true'
        env:
          VISUAL_ONLY: ${{ steps.visual-scope.outputs.only }}
        run: node scripts/ci-with-prod-preview.mjs -- bun run test:visual

      - name: Relatório comparativo consolidado
        if: always()
        run: bun run audit:report

      - name: Upload evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-gates-evidence
          path: |
            seo-reports/a11y-report.json
            seo-reports/link-preview-report.json
            seo-reports/visual
            seo-reports/popup-shots
            seo-reports/source-privacy-report.md
            seo-reports/head-icons-report.json
            seo-reports/indexability-*.json
            seo-reports/indexability-diff.md
            seo-reports/ci-audit-summary.md
            seo-reports/portfolio-funnels-e2e.json
            seo-reports/portfolio-funnels-e2e.html
            public/audit
            seo-reports/client-privacy-report.json
          if-no-files-found: ignore
