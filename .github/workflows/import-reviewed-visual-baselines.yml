name: One-time import of two manually reviewed 0WEB baselines

on:
  push:
    branches: [fix/visual-baseline-home-rbeauty-reviewed-20261027]
    paths: [.github/workflows/import-reviewed-visual-baselines.yml]

permissions:
  contents: write
  actions: read

jobs:
  import-exact-two:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify historical baseline hashes and artifact capture hashes, then import only reviewed images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="fix/visual-baseline-home-rbeauty-reviewed-20261027"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          printf '%s  %s\n' \
            ee1ea1eac04b9615bf96a2944c078fcaf7912c3b603a524508552b4fb61077c2 tests/visual/baseline/home-desktop.png \
            7f3cd92a044058e1c4e5e23f98ff60a96829738e0f2105fc4525fcc0130e98c5 tests/visual/baseline/r_beauty-desktop.png | sha256sum --check

          mkdir -p "$RUNNER_TEMP/reviewed"
          gh run download 40469885227 --repo hrq16000/zeroweb-2026 \
            --name portfolio-gates-evidence --dir "$RUNNER_TEMP/reviewed"
          printf '%s  %s\n' \
            e38dc00648e17bfe20e381417530df4e36c80c2f854a002180631f1cd15ead06 "$RUNNER_TEMP/reviewed/seo-reports/visual/home-desktop.png" \
            18b82bac0fc0f7d0d3d3a792ff6f1f8105267f636901222fa94b1668c996491b "$RUNNER_TEMP/reviewed/seo-reports/visual/r_beauty-desktop.png" | sha256sum --check

          cp "$RUNNER_TEMP/reviewed/seo-reports/visual/home-desktop.png" tests/visual/baseline/home-desktop.png
          cp "$RUNNER_TEMP/reviewed/seo-reports/visual/r_beauty-desktop.png" tests/visual/baseline/r_beauty-desktop.png

          # Do not retain an elevated-permission CI workflow in the proposed merge.
          git rm .github/workflows/import-reviewed-visual-baselines.yml
          git add -- tests/visual/baseline/home-desktop.png tests/visual/baseline/r_beauty-desktop.png
          EXPECTED=$(printf '%s\n' \
            "tests/visual/baseline/home-desktop.png" \
            "tests/visual/baseline/r_beauty-desktop.png" \
            ".github/workflows/import-reviewed-visual-baselines.yml" | sort)
          ACTUAL=$(git diff --cached --name-only | sort)
          test "$ACTUAL" = "$EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): refresh 2 manually inspected obsolete desktop baselines"
          git push origin "HEAD:$BRANCH"
