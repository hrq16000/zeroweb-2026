name: sync-security-lock
on:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/workflows/sync-security-lock.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.head_ref == 'security/tanstack-xss-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
      - name: Synchronize bun.lock
        run: bun install
      - name: Verify frozen install
        run: bun install --frozen-lockfile
      - name: Verify patched TanStack
        run: |
          grep -q '"@tanstack/react-start": "1.168.60"' package.json
          grep -q '@tanstack/react-start@1.168.60' bun.lock
          grep -q '@tanstack/start-server-core@1.169.39' bun.lock
      - name: Commit bun.lock when changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock já sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "security: sincronizar bun.lock após atualização TanStack"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
