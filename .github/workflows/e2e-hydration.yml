name: E2E · Hidratação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://127.0.0.1:8080
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Suíte completa
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Instalar Chromium (Playwright)
        run: bunx playwright install --with-deps chromium

      - name: Build de produção
        run: bun run build

      - name: Validator — contato público
        run: node scripts/validate-no-public-contact.mjs

      - name: Validator — dist
        run: node scripts/validate-no-public-contact-dist.mjs

      - name: Validator — privacidade do cliente
        run: node scripts/validate-client-privacy.mjs

      - name: Subir artefato de produção (Cloudflare worker)
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/server/wrangler.json
          args=(dev --config dist/server/wrangler.json --ip 127.0.0.1 --port 8080)
          [[ -n "${SUPABASE_URL:-}" ]] && args+=(--var "SUPABASE_URL:${SUPABASE_URL}")
          [[ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]] && args+=(--var "SUPABASE_PUBLISHABLE_KEY:${SUPABASE_PUBLISHABLE_KEY}")
          [[ -n "${VITE_SUPABASE_PROJECT_ID:-}" ]] && args+=(--var "SUPABASE_PROJECT_ID:${VITE_SUPABASE_PROJECT_ID}")
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] && args+=(--var "SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_SERVICE_ROLE_KEY}")
          [[ -n "${WHATSAPP_NUMBER:-}" ]] && args+=(--var "WHATSAPP_NUMBER:${WHATSAPP_NUMBER}")
          bunx wrangler@latest "${args[@]}" > /tmp/preview-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "$E2E_BASE_URL/" && exit 0
            sleep 2
          done
          echo "Artefato de produção não respondeu"; cat /tmp/preview-server.log; exit 1

      - name: Gate — dehydrated state no HTML SSR
        run: bun run validate:ssr-payload

      - name: Gate — E2E de hidratação (sem console error, sem blank screen)
        run: bun run test:e2e:hydration

      - name: Gate — E2E Funnel-first
        run: bun run test:e2e:funnel

      - name: Logs do servidor (em caso de falha)
        if: failure()
        run: tail -n 250 /tmp/preview-server.log || true
