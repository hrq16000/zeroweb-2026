name: E2E · Hidratação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://127.0.0.1:8080
      # A configuração pública do Supabase já é versionada em .env.
      # Não sobrescrever com secrets opcionais vazios: Vite prioriza o
      # ambiente do processo e uma string vazia anulava o .env no CI.
    steps:
      - uses: actions/checkout@v4

      # Mantém o mesmo runtime já validado pelos portfolio-gates. Usar `latest`
      # tornava a subida do worker não determinística entre workflows.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar Chromium (Playwright)
        run: bunx playwright install --with-deps chromium

      - name: Build de produção
        run: bun run build

      # O preset do Nitro é `cloudflare-module`: `vite preview` procura
      # dist/server/server.js (inexistente) e falha com ERR_MODULE_NOT_FOUND.
      # O artefato publicado é servido pelo runtime real do worker.
      - name: Subir artefato de produção (worker)
        run: |
          # Testa o mesmo artefato que será publicado. O servidor de
          # desenvolvimento pode responder com fallback do Vite e não
          # representa o HTML SSR de produção.
          PREVIEW_PORT=8080 bun run preview:prod > /tmp/preview-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "$E2E_BASE_URL/" && exit 0
            sleep 2
          done
          echo "Artefato de produção não respondeu"; cat /tmp/preview-server.log; exit 1

      - name: Gate — dehydrated state no HTML SSR
        run: bun run validate:ssr-payload

      - name: Gate — E2E de hidratação (sem console error, sem blank screen)
        run: bun run test:e2e:hydration

      - name: Logs do servidor (em caso de falha)
        if: failure()
        run: tail -n 200 /tmp/preview-server.log
