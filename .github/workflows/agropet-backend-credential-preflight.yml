name: Agropet · backend credentials preflight
on:
  pull_request:
    paths:
      - '.github/workflows/agropet-backend-credential-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.head_ref == 'feat/agropet-filt-preview-20261104' || github.ref_name == 'feat/agropet-filt-preview-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' || secrets.VITE_SUPABASE_URL != '' }}
      HAS_SUPABASE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Record secret presence only (never reveal values)
        run: |
          echo "Supabase URL available as GitHub secret: ${HAS_SUPABASE_URL}"
          echo "Supabase service role available as GitHub secret: ${HAS_SUPABASE_ROLE}"
          echo "Vercel API token available as GitHub secret: ${HAS_VERCEL_TOKEN}"
          if [ "${HAS_SUPABASE_URL}" != "true" ] || [ "${HAS_SUPABASE_ROLE}" != "true" ]; then
            echo "::warning::Backend credentials not available in GitHub Actions; Vercel credentials also absent. Real lead storage cannot be proven."
          fi
