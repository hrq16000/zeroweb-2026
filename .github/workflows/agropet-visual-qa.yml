name: Agropet Filt · visual QA
on:
  pull_request:
    paths:
      - 'src/components/site/AgropetFiltPreviewPage.tsx'
      - 'src/components/site/agropet-filt-preview.css'
      - 'src/routes/portfolio.agropet-filt.tsx'
      - 'src/config/portfolio-project-manifests.json'
      - 'scripts/verify-agropet-portfolio.mjs'
      - '.github/workflows/agropet-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agropet-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-qa:
    name: Agropet screenshots 390/1440 + navigation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Build draft (noindex)
        run: VERCEL_ENV=preview bun run build
      - name: Capture and verify responsive screen
        run: VERCEL_ENV=preview node scripts/ci-with-prod-preview.mjs -- node scripts/verify-agropet-portfolio.mjs
      - name: Upload real screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agropet-filt-visual-390-1440
          path: seo-reports/agropet-visual/*.png
          if-no-files-found: warn
          retention-days: 30
