name: SEO Diff

on:
  # Pull requests run SEO Diff against the PR preview inside build-validate.
  # This workflow remains available for deployed-production verification.
  push:
    branches: [main]
    paths:
      - 'src/routes/**'
      - 'src/lib/seo*'
      - 'src/lib/services-*'
      - 'seo-reports/seo-diff.config.json'
      - 'scripts/run-seo-diff.mjs'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base contra a qual rodar o diff'
        required: false
        default: 'https://0web.com.br'

jobs:
  seo-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # O gate de imagens decide o escopo pela diferença base...head da PR.
          # Checkout raso não contém esses commits e fazia o detector cair no fail-safe.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run seo-diff
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://0web.com.br' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/run-seo-diff.mjs

      - name: Run catalog images check
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/validate-catalog-images.mjs
