name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL alvo (default: produção)"
        required: false
        default: "https://0web.com.br"

jobs:
  scope:
    name: Detectar impacto em Performance + SEO
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Classificar escopo
        id: diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
            HEAD="$PUSH_HEAD_SHA"
          fi

          git fetch --no-tags --depth=1 origin "$BASE" "$HEAD" >/dev/null 2>&1 || true
          FILES="$(git diff --name-only "$BASE" "$HEAD" || true)"
          RUN=false

          if printf '%s\n' "$FILES" | grep -Eq '^(src/(components|pages|styles|assets)/|public/|src/.*\.(css|scss)$|src/lib/seo|src/config/portfolio-(clients|meta)|tailwind|vite\.config|package\.json|bun\.lock)'; then
            RUN=true
          fi

          if printf '%s\n' "$FILES" | grep -E '^src/routes/' | grep -Fvx 'src/routes/portfolio.$slug.tsx' >/dev/null; then
            RUN=true
          fi

          if printf '%s\n' "$FILES" | grep -Fx 'src/routes/portfolio.$slug.tsx' >/dev/null; then
            ROUTE_DIFF="$(git diff --unified=0 "$BASE" "$HEAD" -- 'src/routes/portfolio.$slug.tsx'               | grep -E '^[+-]'               | grep -Ev '^(---|\+\+\+)'               | grep -Eiv 'apple-touch-icon|sizes:|rel: "icon"|canonical|meta:|title:|description:|og:|twitter:' || true)"
            if [ -n "$ROUTE_DIFF" ]; then
              RUN=true
            fi
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "impacto Lighthouse: $RUN"

  lighthouse:
    name: Performance + SEO Gate (shard ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run Lighthouse CI
        env:
          LHCI_TARGET_URL: ${{ github.event.inputs.target_url || 'https://0web.com.br' }}
          LHCI_IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          LHCI_SHARD_INDEX: ${{ matrix.shard }}
          LHCI_SHARD_COUNT: 4
        run: bunx lhci autorun --config=.lighthouserc.cjs

      - name: Upload Lighthouse reports (JSON/HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-portfolio-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            .lighthouseci/**
            lhci-reports/**
          if-no-files-found: ignore
