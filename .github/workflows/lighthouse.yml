name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL alvo (default: produção)"
        required: false
        default: "https://0web.com.br"

jobs:
  lighthouse:
    name: Performance + SEO Gate (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run Lighthouse CI
        env:
          LHCI_TARGET_URL: ${{ github.event.inputs.target_url || 'https://0web.com.br' }}
          LHCI_IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          LHCI_SHARD_INDEX: ${{ matrix.shard }}
          LHCI_SHARD_COUNT: 4
        run: bunx lhci autorun --config=.lighthouserc.cjs

      - name: Upload Lighthouse reports (JSON/HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-portfolio-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            .lighthouseci/**
            lhci-reports/**
          if-no-files-found: ignore
