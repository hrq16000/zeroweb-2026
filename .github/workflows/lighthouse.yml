name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL alvo (default: produção)"
        required: false
        default: "https://0web.com.br"

jobs:
  lighthouse:
    name: Performance + SEO Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run Lighthouse CI
        env:
          LHCI_TARGET_URL: ${{ github.event.inputs.target_url || 'https://0web.com.br' }}
        run: bunx lhci autorun --config=.lighthouserc.cjs
