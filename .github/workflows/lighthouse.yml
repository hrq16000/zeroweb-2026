name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL alvo (default: produção)"
        required: false
        default: "https://0web.com.br"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detectar impacto em Performance + SEO
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
      mode: ${{ steps.diff.outputs.mode }}
      shards: ${{ steps.diff.outputs.shards }}
      only: ${{ steps.diff.outputs.only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Classificar escopo
        id: diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "shards=[0,1,2,3]" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
            HEAD="$PUSH_HEAD_SHA"
          fi

          git fetch --no-tags --depth=1 origin "$BASE" "$HEAD" >/dev/null 2>&1 || true
          FILES="$(git diff --name-only "$BASE" "$HEAD" || true)"
          RUN=false
          MODE=full

          REGIONAL_ONLY=true
          if [ -z "$FILES" ]; then
            REGIONAL_ONLY=false
          fi
          while IFS= read -r FILE; do
            case "$FILE" in
              src/lib/portfolio-clusters.ts|src/lib/portfolio-clusters.test.ts|'src/routes/portfolio.$segmento.$bairro.tsx') ;;
              *) REGIONAL_ONLY=false ;;
            esac
          done < <(printf '%s\n' "$FILES")

          if [ "$REGIONAL_ONLY" = true ]; then
            RUN=true
            MODE=regional
          fi

          # Troca isolada de OG social + cache-bust não altera o DOM visível.
          # Esses casos continuam cobertos pelos gates de link preview/head e
          # não devem disparar regressão visual/Lighthouse de todos os projetos.
          SOCIAL_PREVIEW_ONLY=true
          if [ -z "$FILES" ]; then
            SOCIAL_PREVIEW_ONLY=false
          fi
          while IFS= read -r FILE; do
            case "$FILE" in
              public/images/*/social-og.jpg|src/config/portfolio-assets.json|src/config/portfolio-admin-seed.json) ;;
              *) SOCIAL_PREVIEW_ONLY=false ;;
            esac
          done < <(printf '%s\n' "$FILES")

          if [ "$SOCIAL_PREVIEW_ONLY" = true ]; then
            CONFIG_DIFF="$(git diff --unified=0 "$BASE" "$HEAD" -- src/config/portfolio-assets.json src/config/portfolio-admin-seed.json \
              | grep -E '^[+-]' \
              | grep -Ev '^(---|\+\+\+)' \
              | grep -Ev '^[+-][[:space:]]*"socialVersion":' || true)"
            if [ -n "$CONFIG_DIFF" ]; then
              SOCIAL_PREVIEW_ONLY=false
            fi
          fi

          if [ "$SOCIAL_PREVIEW_ONLY" != true ] && printf '%s\n' "$FILES" | grep -Eq '^(src/(components|pages|styles|assets)/|public/|src/.*\.(css|scss)$|src/lib/seo|src/config/portfolio-(clients|meta)|tailwind|vite\.config|bun\.lock)'; then
            RUN=true
          fi

          if printf '%s\n' "$FILES" | grep -E '^src/routes/' | grep -Fvx 'src/routes/portfolio.$slug.tsx' >/dev/null; then
            RUN=true
          fi

          if printf '%s\n' "$FILES" | grep -Fx 'src/routes/portfolio.$slug.tsx' >/dev/null; then
            ROUTE_DIFF="$(git diff --unified=0 "$BASE" "$HEAD" -- 'src/routes/portfolio.$slug.tsx'               | grep -E '^[+-]'               | grep -Ev '^(---|\+\+\+)'               | grep -Eiv 'apple-touch-icon|sizes:|rel: "icon"|canonical|meta:|title:|description:|og:|twitter:' || true)"
            if [ -n "$ROUTE_DIFF" ]; then
              RUN=true
            fi
          fi

          ONLY="$(printf '%s\n' "$FILES" | node scripts/resolve-visual-regression-scope.mjs)"
          if [ -n "$ONLY" ]; then
            MODE=portfolio
            SHARDS='[0]'
          elif [ "$MODE" = "regional" ]; then
            SHARDS='[0]'
          else
            SHARDS='[0,1,2,3]'
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "impacto Lighthouse: $RUN ($MODE; shards=$SHARDS; only=${ONLY:-global})"

  lighthouse:
    name: Performance + SEO Gate (shard ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run Lighthouse CI
        env:
          LHCI_TARGET_URL: ${{ github.event.inputs.target_url || 'https://0web.com.br' }}
          LHCI_IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          LHCI_SHARD_INDEX: ${{ matrix.shard }}
          LHCI_SHARD_COUNT: 4
          LHCI_SCOPE: ${{ needs.scope.outputs.mode }}
          LHCI_ONLY: ${{ needs.scope.outputs.only }}
        run: bunx lhci autorun --config=.lighthouserc.cjs

      - name: Upload Lighthouse reports (JSON/HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-portfolio-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            .lighthouseci/**
            lhci-reports/**
          include-hidden-files: true
          if-no-files-found: ignore
