name: Toop Assados · QA visual real
on:
  pull_request:
    paths:
      - 'scripts/verify-toop-assados.mjs'
      - '.github/workflows/toop-assados-visual-qa.yml'
      - 'src/components/site/ToopAssadosPreviewPage.tsx'
      - 'src/routes/portfolio.toop-assados.tsx'
      - 'src/config/portfolio-project-manifests.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toop-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-qa:
    name: Toop 390/768/1440 + NO-BRAND evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build visual QA preview (not production)
        run: VERCEL_ENV=preview bunx vite build --mode development
      - name: Verify real pages and collect visual evidence
        run: VERCEL_ENV=preview CI_PREVIEW_ATTEMPTS=1 node scripts/ci-with-prod-preview.mjs -- node scripts/verify-toop-assados.mjs
      - name: Upload unapproved screenshots for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toop-assados-real-390-768-1440-no-brand
          path: seo-reports/toop-assados-visual/*.png
          if-no-files-found: warn
          retention-days: 30
