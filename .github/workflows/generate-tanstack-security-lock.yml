name: generate-tanstack-security-lock

on:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/workflows/generate-tanstack-security-lock.yml

permissions:
  contents: read

jobs:
  lockfile:
    if: github.head_ref == 'security/tanstack-xss-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate bun.lock
        run: bun install
      - name: Verify patched TanStack versions
        run: |
          grep -q '"@tanstack/react-start": "1.168.60"' package.json
          grep -q '@tanstack/react-start@1.168.60' bun.lock
          grep -q '@tanstack/start-server-core@1.169.39' bun.lock
      - uses: actions/upload-artifact@v4
        with:
          name: tanstack-security-lock
          path: bun.lock
          if-no-files-found: error
