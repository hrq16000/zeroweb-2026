<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Infinito Spa — masajes y masoterapia en Santiago</title><desc id="desc">Composición tipográfica verde bosque y arena para masajes y masoterapia en Santiago.</desc><rect width="1200" height="900" fill="#14392F"/><circle cx="940" cy="420" r="310" fill="none" stroke="#D9BD8D" stroke-opacity=".25" stroke-width="3"/><circle cx="940" cy="420" r="245" fill="none" stroke="#D9BD8D" stroke-opacity=".18" stroke-width="2"/><path d="M720 420c0-160 170-160 220 0s220 160 220 0-170-160-220 0-220 160-220 0Z" fill="none" stroke="#D9BD8D" stroke-width="8"/><text x="92" y="170" fill="#E9D9B7" font-family="Arial,sans-serif" font-size="28" letter-spacing="8">INFINITO SPA</text><text x="88" y="370" fill="#F6F1E7" font-family="Georgia,serif" font-size="92">Un espacio</text><text x="88" y="475" fill="#F6F1E7" font-family="Georgia,serif" font-size="92">para volver a ti.</text><text x="94" y="600" fill="#D9BD8D" font-family="Arial,sans-serif" font-size="26" letter-spacing="3">MASAJES Y MASOTERAPIA</text><text x="94" y="660" fill="#E9D9B7" font-family="Arial,sans-serif" font-size="25">Santiago, Chile</text><text x="94" y="810" fill="#D7C6A5" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">ATENCIÓN CON COORDINACIÓN PREVIA</text></svg>
