<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ilustração editorial de uma reunião executiva noturna em Curitiba</title>
  <desc id="desc">Cena conceitual em azul-noite e dourado, com sala de reunião envidraçada, pessoas em conversa e cidade ao fundo. Não representa fotografia documental do evento.</desc>
